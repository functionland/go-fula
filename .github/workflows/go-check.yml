on: [ push, pull_request ]
name: Go Checks

jobs:
  unit:
    runs-on: ubuntu-latest
    name: All
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
      # Analyzer tools must build with the Go above (1.25: cmd/blox doesn't build on 1.26 yet). staticcheck
      # v0.7.0 (2026.1) and x/tools v0.49.0 are the last releases that do; newer ones need Go 1.26, and
      # v0.4.6 no longer builds on 1.25. Bump these together with go-version.
      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@v0.7.0
      - name: Clear Go module cache
        run: go clean -modcache
      - name: Check that go.mod is tidy
        run: |
          go mod tidy
          if [[ -n $(git ls-files --other --exclude-standard --directory -- go.sum) ]]; then
            echo "go.sum was added by go mod tidy"
            exit 1
          fi
          git diff --exit-code -- go.sum go.mod
      - name: gofmt
        if: success() || failure()
        run: |
          out=$(gofmt -s -l .)
          if [[ -n "$out" ]]; then
            echo $out | awk '{print "::error file=" $0 ",line=0,col=0::File is not gofmt-ed."}'
            exit 1
          fi
      - name: go vet
        if: success() || failure()
        run: go vet ./...
      - name: Install shadow analyzer
        if: success() || failure()
        run: go install golang.org/x/tools/go/analysis/passes/shadow/cmd/shadow@v0.49.0
      # A shadowed `err` in wap/pkg/server once left the WAP API refusing to start after a SUCCESSFUL bind:
      # the retry loop redeclared err, so the outer err still held the original failure and Serve() logged
      # "Successfully bound ..." immediately followed by "... Server will not start." `go vet` does not catch
      # this class; the shadow analyzer does. That package is network-facing and is now kept clean, so it is
      # a hard gate. The rest of the repo has ~80 pre-existing (mostly benign) shadows, so it is reported for
      # visibility without failing the build — tighten the scope as packages get cleaned up.
      - name: shadow (blocking — wap/pkg/server)
        if: success() || failure()
        run: shadow ./wap/pkg/server/...
      - name: shadow (advisory — rest of the repo)
        if: success() || failure()
        continue-on-error: true
        run: shadow ./...
      - name: staticcheck
        if: success() || failure()
        run: |
          set -o pipefail
          staticcheck ./... | sed -e 's@\(.*\)\.go@./\1.go@g'
      - name: go generate
        if: (success() || failure())
        run: |
          git clean -fd # make sure there aren't untracked files / directories
          go generate -x ./...
          # check if go generate modified or added any files
          if ! $(git add . && git diff-index HEAD --exit-code --quiet); then
            echo "go generated caused changes to the repository:"
            git status --short
            exit 1
          fi
